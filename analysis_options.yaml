include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - .tooling/**
    - build/**
    - lib/**/*.g.dart
    - lib/l10n/generated/**
    - test/generated_migrations/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true

linter:
  rules:
    avoid_print: true
    unawaited_futures: true
