name: denezhno
description: Локальное приложение личных финансов. Основа R1.
publish_to: none
version: 0.3.0+3

environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 2.0.0
  flutter_riverpod: 3.4.3
  go_router: 18.1.2
  intl: 0.20.3
  drift: 2.35.3
  sqlite3: 3.8.0
  flutter_secure_storage: 11.2.0
  flutter_local_notifications: 22.3.2
  timezone: 0.11.1
  sodium: 4.1.2+1
  share_plus: 13.3.1
  file_selector: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.17.1
  drift_dev: 2.35.2
  crypto: 3.0.8

flutter:
  generate: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
